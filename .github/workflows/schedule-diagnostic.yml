name: Temporary schedule diagnostic
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report trigger and UTC time
        run: |
          echo "Event: ${{ github.event_name }}"
          date -u
